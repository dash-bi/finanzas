<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif; background: #F5F3FA; }
    * { box-sizing: border-box; }
    a { color: #7B2FF7; text-decoration: none; }
    a:hover { color: #4B0FA8; }
    .disp { font-family: "Outfit", "Segoe UI", system-ui, sans-serif; letter-spacing: -0.02em; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</helmet>

<div style="width: 390px; height: 844px; overflow: hidden; background: #F5F3FA; display: flex; flex-direction: column; color: #16062B;">

  <!-- Cabecera violeta -->
  <div style="background: linear-gradient(160deg, #3A1370 0%, #240C46 60%, #1A0733 100%); padding: 58px 20px 26px; border-radius: 0 0 30px 30px; position: relative; overflow: hidden;">
    <div style="position: absolute; right: -50px; top: -20px; width: 170px; height: 170px; border-radius: 999px; background: {{primario}}; opacity: 0.34;"></div>

    <div style="position: relative; display: flex; align-items: center; gap: 12px;">
      <div style="width: 42px; height: 42px; border-radius: 999px; background: {{primario}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; border: 2.5px solid {{acento}};">LR</div>
      <div style="flex: 1;">
        <div style="font-size: 12.5px; color: #A99AD1; font-weight: 500;">Buenos días,</div>
        <div class="disp" style="font-size: 17px; font-weight: 700; color: #FFFFFF; line-height: 1.15;">Laura</div>
      </div>
      <div style="width: 40px; height: 40px; border-radius: 999px; background: rgba(255,255,255,0.10); display: flex; align-items: center; justify-content: center;">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
      </div>
    </div>

    <div style="position: relative; margin-top: 26px;">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 12.5px; color: #A99AD1; font-weight: 600;">Saldo en caja</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A99AD1" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="2.6"/></svg>
      </div>
      <div class="disp num" style="font-size: 34px; font-weight: 700; color: #FFFFFF; margin-top: 5px;">$ 102.718.582</div>
      <div style="display: flex; align-items: center; gap: 7px; margin-top: 9px;">
        <span style="display: inline-flex; align-items: center; gap: 3px; background: {{acento}}; color: #12061F; font-size: 11.5px; font-weight: 800; border-radius: 999px; padding: 3px 10px;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 14 6-6 6 6"/></svg>
          6,4 %
        </span>
        <span style="font-size: 11.5px; color: #A99AD1; font-weight: 500;">vs. agosto</span>
      </div>
    </div>
  </div>

  <!-- Acciones rápidas -->
  <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; padding: 20px 20px 0;">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
      <div style="width: 100%; height: 56px; border-radius: 20px; background: {{primario}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 18px rgba(123,47,247,0.28);">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      </div>
      <span style="font-size: 11.5px; font-weight: 700; color: #4B4266;">Vender</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
      <div style="width: 100%; height: 56px; border-radius: 20px; background: {{acento}}; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#12061F" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m6 12 6 6 6-6"/></svg>
      </div>
      <span style="font-size: 11.5px; font-weight: 700; color: #4B4266;">Cobrar</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
      <div style="width: 100%; height: 56px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4B4266" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 12l9 9 9-9z"/></svg>
      </div>
      <span style="font-size: 11.5px; font-weight: 700; color: #4B4266;">Gasto</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 7px;">
      <div style="width: 100%; height: 56px; border-radius: 20px; background: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#4B4266" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16"/><path d="M6 16V9"/><path d="M11 16V5"/><path d="M16 16v-4"/></svg>
      </div>
      <span style="font-size: 11.5px; font-weight: 700; color: #4B4266;">Informes</span>
    </div>
  </div>

  <!-- Tarjetas -->
  <div style="padding: 20px 20px 0; display: flex; flex-direction: column; gap: 12px;">

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
      <div style="background: #FFFFFF; border-radius: 22px; padding: 15px 16px;">
        <div style="width: 30px; height: 30px; border-radius: 10px; background: #F0E7FF; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{primario}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18 10 12l4 4 6-8"/></svg>
        </div>
        <div style="font-size: 10.5px; font-weight: 800; color: #8E82AC; letter-spacing: 0.05em;">INGRESOS</div>
        <div class="disp num" style="font-size: 19px; font-weight: 700; margin-top: 3px;">$ 19,5 M</div>
      </div>
      <div style="background: #FFFFFF; border-radius: 22px; padding: 15px 16px;">
        <div style="width: 30px; height: 30px; border-radius: 10px; background: #E4FBF2; display: flex; align-items: center; justify-content: center; margin-bottom: 10px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#12C48B" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18"/><path d="M17 8a4 4 0 0 0-4-3h-2a3 3 0 0 0 0 6h2a3 3 0 0 1 0 6h-2a4 4 0 0 1-4-3"/></svg>
        </div>
        <div style="font-size: 10.5px; font-weight: 800; color: #8E82AC; letter-spacing: 0.05em;">UTILIDAD</div>
        <div class="disp num" style="font-size: 19px; font-weight: 700; margin-top: 3px;">$ 8,1 M</div>
      </div>
    </div>

    <div style="background: #FFFFFF; border-radius: 24px; padding: 17px 18px;">
      <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 12px;">
        <div style="flex: 1;">
          <div class="disp" style="font-size: 14.5px; font-weight: 700;">Ventas de la semana</div>
          <div style="font-size: 11.5px; color: #8E82AC; font-weight: 500; margin-top: 1px;">01 – 09 de septiembre</div>
        </div>
        <span style="background: #E4FBF2; color: #0B8C63; font-size: 11px; font-weight: 800; border-radius: 999px; padding: 4px 10px;">+12,8 %</span>
      </div>

      <svg viewBox="0 0 320 96" style="width: 100%; height: auto; display: block;">
        <defs>
          <linearGradient id="gm" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="{{primario}}" stop-opacity="0.28"/>
            <stop offset="100%" stop-color="{{primario}}" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <path d="M4 84 L48 66 L92 40 L136 76 L180 78 L224 82 L268 52 L316 16 L316 92 L4 92 Z" fill="url(#gm)"/>
        <polyline points="4,84 48,66 92,40 136,76 180,78 224,82 268,52 316,16" fill="none" stroke="{{primario}}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="316" cy="16" r="5.5" fill="{{acento}}" stroke="#FFFFFF" stroke-width="2.6"/>
      </svg>
    </div>

    <div style="background: #FFE9EE; border-radius: 24px; padding: 15px 17px; display: flex; align-items: center; gap: 13px;">
      <div style="width: 40px; height: 40px; border-radius: 14px; background: #FF4D6D; display: flex; align-items: center; justify-content: center; flex: 0 0 40px;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>
      </div>
      <div style="flex: 1; min-width: 0;">
        <div style="font-size: 13.5px; font-weight: 800; color: #8E1B33;">16 facturas vencidas</div>
        <div class="num" style="font-size: 12px; color: #A32B45; font-weight: 600; margin-top: 1px;">$ 16.046.861 por cobrar</div>
      </div>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8E1B33" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </div>
  </div>

  <!-- Navegación inferior -->
  <div style="margin-top: auto; background: #FFFFFF; border-radius: 28px 28px 0 0; padding: 14px 22px 26px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 -6px 24px rgba(22,6,43,0.06);">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{primario}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="2"/><rect x="14" y="3" width="7" height="5" rx="2"/><rect x="14" y="12" width="7" height="9" rx="2"/><rect x="3" y="16" width="7" height="5" rx="2"/></svg>
      <span style="font-size: 10.5px; font-weight: 800; color: {{primario}};">Inicio</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A79BC4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M6 6v13a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1V6"/><path d="M9 10h6"/></svg>
      <span style="font-size: 10.5px; font-weight: 700; color: #A79BC4;">Ventas</span>
    </div>
    <div style="width: 54px; height: 54px; border-radius: 20px; background: {{primario}}; display: flex; align-items: center; justify-content: center; margin-top: -26px; box-shadow: 0 10px 22px rgba(123,47,247,0.4); border: 4px solid #FFFFFF;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A79BC4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <span style="font-size: 10.5px; font-weight: 700; color: #A79BC4;">Cartera</span>
    </div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#A79BC4" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
      <span style="font-size: 10.5px; font-weight: 700; color: #A79BC4;">Perfil</span>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{"primario":{"editor":"color","default":"#7B2FF7","options":["#7B2FF7","#820AD1","#5B4BFF","#9A4DFF"],"section":"Paleta"},"acento":{"editor":"color","default":"#C9F73F","options":["#C9F73F","#B8F32C","#7DF7A8","#00E38C"],"section":"Paleta"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      primario: this.props.primario ?? '#7B2FF7',
      acento: this.props.acento ?? '#C9F73F'
    };
  }
}
</script>
</body>
</html>
